packages:
  - packages/*

allowBuilds:
  '@swc/core': true
  esbuild: false

publicHoistPattern:
  - typescript
  - '@types/*'
  - '@biomejs/*'
  - '@swc/*'
  - vitest
  - '@vitest/*'
  - tsx
  - turbo
  - del-cli

catalog:
  '@noble/hashes': ^2.0.1
  '@kigu/dev': ^0.3.2
  '@hono/node-server': ^2.1.4
  '@hono/otel': ^1.2.0
  '@logtape/logtape': ^2.4.0
  '@opentelemetry/api': ^1.9.1
  '@opentelemetry/api-logs': ^0.223.0
  '@opentelemetry/sdk-trace-base': ^2.12.0
  '@standard-schema/spec': ^1.1.0
  ajv: ^8.20.0
  ajv-formats: ^3.0.1
  expo-crypto: ^57.0.3
  get-port: ^7.2.0
  hono: ^4.13.13
  json-schema-to-ts: ^3.1.1
  uint8arrays: ^6.1.1

catalogMode: prefer

minimumReleaseAgeExclude:
  - '@kigu/*'

supportedArchitectures:
  cpu: [ current ]
  os: [ current ]

publishBranch: main

# Every package versions independently: no fixed groups, no lanes, no epics.
versioning:
  changelog:
    storage: repository
